name: Feature request
description: Suggest a focused gameplay, accessibility, audio, or visual improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem or opportunity does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      placeholder: Describe how the feature would work from the player's perspective.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay
        - Voice controls
        - Keyboard or touch controls
        - Accessibility
        - Visuals or animation
        - Audio or music
        - Performance
        - Documentation
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives or tradeoffs
      description: Optional, but useful for larger ideas.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar suggestions.
          required: true
